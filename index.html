<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E7D32">
<title>EREKE M&D — онлайн дүкен</title>
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
:root{--g:#2E7D32;--g2:#1B5E20;--gl:#E8F3E9;--ink:#1C2520;--mut:#6B776F;--bg:#F3F5F2;--card:#fff;--line:#E3E8E3;--red:#E53935;--amber:#F2A33A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#0f2412;display:flex;justify-content:center}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.app{position:relative;width:100%;max-width:430px;height:100dvh;background:var(--bg);overflow:hidden}
@media(min-width:600px){body{align-items:center;background:radial-gradient(circle at 30% 20%,#2f5a33,#0b1a0d)}.app{height:min(900px,96vh);border-radius:36px;box-shadow:0 30px 80px rgba(0,0,0,.45)}}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:20px}
.top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;background:var(--bg)}
.top h1{flex:1;text-align:center;font-size:18px;font-weight:700}
.ib{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.06);flex:none;position:relative}
.ib svg{width:20px;height:20px}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff}
.search{display:flex;align-items:center;gap:10px;margin:0 16px;height:46px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.search input{flex:1;border:0;outline:0;background:none;font-size:15px}
.search svg{flex:none;color:var(--mut)}
.sec{padding:18px 16px 0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sec-h h2{font-size:19px;font-weight:800}
.sec-h a,.sec-h span{font-size:13px;color:var(--mut);text-decoration:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:14px;font-weight:700;font-size:16px;width:100%}
.btn-g{background:var(--g);color:#fff}
.btn-l{background:var(--gl);color:var(--g2)}
.btn:active{transform:scale(.98)}
.card{background:var(--card);border-radius:16px;border:1px solid var(--line)}
/* nav */
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(env(safe-area-inset-bottom) + 6px)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut);padding:4px 0;position:relative}
.nav button.on{color:var(--g);font-weight:700}
.nav svg{width:24px;height:24px}
.badge{position:absolute;top:0;left:calc(50% + 4px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
/* welcome */
#welcome{background:url(img/welcome.webp) center/cover;align-items:center;text-align:center}
#welcome .wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 9dvh) 28px 0;flex:1;width:100%}
#welcome .logo{width:150px;height:150px;border-radius:50%;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#welcome h1{margin-top:22px;font-size:34px;font-weight:800;color:var(--g);letter-spacing:.5px}
#welcome .tag{margin-top:10px;font-family:Lora,serif;font-style:italic;font-size:24px;line-height:1.25;color:var(--g2)}
#welcome .sub{margin-top:8px;font-size:14px;color:#3d4a40}
#welcome .go{margin-top:auto;margin-bottom:calc(env(safe-area-inset-bottom) + 40px);box-shadow:0 8px 20px rgba(27,94,32,.35)}
/* home */
.hhead{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 16px 12px}
.hhead img{width:40px;height:40px;border-radius:50%}
.hhead b{font-size:22px;font-weight:800;color:var(--g);flex:1}
.loc{display:flex;align-items:center;gap:4px;padding:8px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600}
.banner{margin:14px 16px 0;border-radius:20px;overflow:hidden;position:relative;height:170px;background:linear-gradient(105deg,#2E7D32 0%,#3f9346 48%,rgba(63,147,70,.0) 100%),url(img/p/saumal.webp) right center/auto 100% no-repeat,#9cc79f;color:#fff;padding:16px 18px}
.banner .tagx{display:inline-block;background:var(--amber);color:#1c2520;font-size:11px;font-weight:800;padding:4px 8px;border-radius:6px}
.banner h3{margin-top:10px;font-size:21px;line-height:1.2;font-weight:800;max-width:210px}
.banner p{margin-top:6px;font-size:12.5px;opacity:.92;max-width:200px}
.banner button{margin-top:10px;background:#fff;color:var(--g2);font-weight:700;font-size:13px;padding:7px 14px;border-radius:10px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 16px 0}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;background:var(--card);border:1px solid var(--line);border-radius:16px;font-size:12px;font-weight:600}
.quick svg{color:var(--g);width:22px;height:22px}
.cats{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:calc((100% - 36px)/4);gap:14px 12px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.cats::-webkit-scrollbar{display:none}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;text-align:center}
.cat img{width:64px;height:64px;border-radius:18px;object-fit:cover;background:#fff;border:1px solid var(--line)}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:0 16px 4px;margin:0 -16px}
.hscroll::-webkit-scrollbar{display:none}
.pc{position:relative;flex:none;width:156px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left}
.pc img{display:block;width:100%;height:120px;object-fit:cover}
.pc .b{padding:10px}
.pc .n{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .s{font-size:12px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.pc .p{font-weight:800;color:var(--g)}
.add{width:32px;height:32px;border-radius:10px;background:var(--g);color:#fff;display:grid;place-items:center}
.fav{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--mut)}
.fav.on{color:var(--red)}
.fav svg{width:16px;height:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .pc{width:auto}
/* category list */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 16px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.list{background:var(--card);border-radius:18px;border:1px solid var(--line);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li img{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none;background:#f6f6f6}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:15px}
.li .t small{color:var(--mut);font-size:12.5px}
.li .pr{font-weight:800;color:var(--g);white-space:nowrap}
.li .chev{color:#b5bdb7}
/* product */
.pimg{position:relative;height:330px;background:#fff}
.pimg img{width:100%;height:100%;object-fit:cover}
.pimg .tb{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:16px;right:16px;display:flex;gap:8px}
.pimg .tb .sp{flex:1}
.pbody{padding:16px}
.pchip{display:inline-block;padding:4px 10px;border-radius:8px;background:var(--gl);color:var(--g2);font-size:12px;font-weight:700}
.pname{font-size:24px;font-weight:800;margin-top:8px}
.psize{color:var(--mut);margin-top:4px;font-size:14px}
.pprice{font-size:28px;font-weight:800;color:var(--g);margin-top:10px}
.pdesc{margin-top:10px;font-size:15px;line-height:1.55;color:#36423a}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.feats div{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:11.5px;font-weight:600;text-align:center}
.feats svg{color:var(--g);width:20px;height:20px}
.benef{display:flex;align-items:center;gap:12px;margin-top:14px;padding:14px;border-radius:16px;background:var(--gl);width:100%;text-align:left}
.benef .ic{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;color:var(--g);flex:none}
.benef b{display:block;font-size:15px;color:var(--g2)}
.benef small{color:#4c6a50;font-size:12.5px}
.buybar{display:flex;gap:12px;align-items:center;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:var(--card);border-top:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:6px;padding:4px;border-radius:14px;border:1px solid var(--line)}
.qty button{width:36px;height:36px;border-radius:10px;font-size:20px;display:grid;place-items:center}
.qty span{min-width:22px;text-align:center;font-weight:700}
/* benefits */
.bhero{position:relative;height:200px;background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;color:#fff}
.bhero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(20,60,25,.85))}
.bhero>*{position:relative}
.bhero h2{font-size:24px;font-weight:800}
.bhero p{font-size:13px;opacity:.9;margin-top:2px}
.bc{display:flex;gap:12px;padding:14px;margin-top:10px}
.bc .ic{width:38px;height:38px;border-radius:12px;background:var(--gl);color:var(--g);display:grid;place-items:center;flex:none}
.bc.warn .ic{background:#FFF3E0;color:#E65100}
.bc b{display:block;font-size:15px;margin-bottom:4px}
.bc p{font-size:14px;line-height:1.5;color:#3d4a40}
.src{font-size:11.5px;color:var(--mut);line-height:1.5;margin-top:14px}
/* cart */
.ci{display:flex;gap:12px;padding:12px;align-items:center}
.ci img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none}
.ci .t{flex:1;min-width:0}
.ci .t b{display:block;font-size:15px}
.ci .t small{color:var(--mut);font-size:12.5px}
.ci .t .pr{font-weight:800;color:var(--g);margin-top:4px}
.ci .r{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.ci .qty{padding:2px}
.ci .qty button{width:28px;height:28px;font-size:16px}
.sum{padding:14px}
.sum .row{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);padding:4px 0}
.sum .tot{color:var(--ink);font-size:18px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.sum .tot span:last-child{color:var(--g)}
.empty{text-align:center;padding:60px 30px;color:var(--mut)}
.empty .ei{width:80px;height:80px;border-radius:50%;background:var(--gl);color:var(--g);display:grid;place-items:center;margin:0 auto 14px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
/* checkout */
.blk{padding:14px;margin-top:12px}
.blk h3{font-size:16px;font-weight:800;margin-bottom:10px}
.inp{display:flex;align-items:center;gap:10px;height:48px;padding:0 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.inp input{flex:1;border:0;outline:0;background:none;font-size:15px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:14px;border:1.5px solid var(--line);margin-top:8px}
.opt.on{border-color:var(--g);background:var(--gl)}
.opt .oi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:22px;background:#fff;border:1px solid var(--line)}
.opt .t{flex:1}
.opt .t b{display:block;font-size:15px}
.opt .t small{display:block;color:var(--mut);font-size:12.5px;line-height:1.35}
.opt .t em{font-style:normal;color:var(--g);font-weight:700;font-size:12.5px}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid #c3cbc5;flex:none;display:grid;place-items:center}
.opt.on .radio{border-color:var(--g)}
.opt.on .radio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--g)}
.tline{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:15px;width:100%;text-align:left}
.tline.on .radio{border-color:var(--g)}
.tline.on .radio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--g)}
.inp input{min-width:0;width:100%}a.btn{text-decoration:none}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--mut);margin:16px 4px 8px}
.fl{margin-top:10px}.fl:first-child{margin-top:0}.fl label{display:block;font-size:12.5px;color:var(--mut);margin:0 0 5px 2px}
.selb{width:100%;justify-content:space-between;text-align:left;font-size:15px}.selb .ph{color:#9aa49d}.selb.dis{opacity:.55}.selb svg{color:var(--mut)}
.hint{font-size:12.5px;color:var(--mut);line-height:1.45;margin-top:10px}.hint a{color:var(--g);font-weight:600}
.note{background:var(--gl);color:var(--g2);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.45;margin-top:4px}
.opt.tx{cursor:pointer;background:var(--card)}.opt.tx.on{background:var(--gl)}
.badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff;font-weight:800;font-size:15px}
.kz{font-style:normal;font-size:10px;background:#00AFCA;color:#fff;border-radius:5px;padding:1px 5px;margin-left:4px;vertical-align:2px}
.open{padding:8px 14px;border-radius:10px;background:var(--g);color:#fff;font-weight:700;font-size:13px;flex:none}
.addr{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.addr .oi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--gl);color:var(--g);flex:none}
.addr .t{flex:1;min-width:0}.addr .t b{display:block;font-size:14.5px}.addr .t small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}.addr>svg{color:var(--mut);flex:none}
.bank{margin-top:6px;border-radius:18px;padding:18px;height:190px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:linear-gradient(135deg,#1B5E20,#43A047);box-shadow:0 10px 24px rgba(27,94,32,.3);position:relative}
.bank .chip-c{width:40px;height:30px;border-radius:6px;background:linear-gradient(135deg,#f6d77a,#c9a227)}
.bank .no{font-size:21px;letter-spacing:.08em;font-weight:600;font-variant-numeric:tabular-nums}
.bank .bf{display:flex;justify-content:space-between;font-size:13px;opacity:.9;letter-spacing:.05em}
.bank .vm{position:absolute;top:18px;right:18px;font-size:13px;opacity:.9}
/* done */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
.done .ok{width:110px;height:110px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;box-shadow:0 10px 30px rgba(46,125,50,.35)}
.done h2{font-size:26px;font-weight:800;margin-top:22px}
.done p{color:var(--mut);margin-top:8px;line-height:1.5}
.done .btns{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:30px}
/* orders */
.ord{padding:14px;margin-top:10px}
.ord .h{display:flex;justify-content:space-between;align-items:center}
.ord .st{font-size:12px;font-weight:700;color:var(--g);background:var(--gl);padding:4px 8px;border-radius:8px}
.ord .th{display:flex;gap:6px;margin-top:10px}
.ord .th img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.ord .f{display:flex;justify-content:space-between;margin-top:10px;font-size:14px}
.steps{display:flex;gap:4px;margin-top:12px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--g)}
.stl{display:flex;justify-content:space-between;margin-top:5px;font-size:10px;color:var(--mut)}.stl span.on{color:var(--g);font-weight:700}
.offl{margin-top:4px;font-size:11px;font-weight:700;color:#DC2626}
/* profile */
.pf{display:flex;align-items:center;gap:14px;padding:16px}
.pf .av{width:60px;height:60px;border-radius:50%;background:var(--gl);color:var(--g);display:grid;place-items:center;font-size:24px;font-weight:800}
.pr-row{display:flex;align-items:center;gap:12px;padding:14px;width:100%;text-align:left;border-bottom:1px solid var(--line);font-size:15px}
.pr-row:last-child{border-bottom:0}
.pr-row .ic{width:36px;height:36px;border-radius:10px;background:var(--gl);color:var(--g);display:grid;place-items:center;flex:none}
.pr-row span{flex:1}
.pr-row small{color:var(--mut)}
.toast{position:absolute;left:50%;bottom:100px;transform:translate(-50%,16px);background:#1c2520;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:86%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.demo{position:absolute;top:calc(env(safe-area-inset-top) + 4px);left:50%;transform:translateX(-50%);z-index:60;font-size:9px;font-weight:800;letter-spacing:.08em;background:rgba(0,0,0,.35);color:#fff;padding:2px 7px;border-radius:5px;pointer-events:none}
</style>
</head>
<body>
<div class="app" id="app"><div class="demo">ДЕМО</div><div id="root"></div><div class="toast" id="toast"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="benefits.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n.toLocaleString('ru-RU').replace(/,/g,' ')+' ₸';
const P=Object.fromEntries(PRODUCTS.map(p=>[p.id,p]));
const C=Object.fromEntries(CATS.map(c=>[c.id,c]));
const catId=n=>CATS.find(c=>c.n===n).id;
const desc=p=>p.d?p.d+' EREKE M&D дүкенінен сапалы өнім, Ұзынағаш бойынша үйге дейін жеткіземіз.':p.n+' — EREKE M&D дүкенінен сапалы өнім. Ұзынағаш бойынша үйге дейін жеткіземіз.';
const img=p=>p.img||`img/p/${p.id}.webp`;

/* state */
const LS={get(k,d){try{return JSON.parse(localStorage.getItem('ereke-'+k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem('ereke-'+k,JSON.stringify(v))}catch(e){}}};
let S={cart:LS.get('cart',{}),fav:LS.get('fav',[]),orders:LS.get('orders',[]),seen:LS.get('seen',[]),
  ck:Object.assign({addr:'',del:'post',time:'today',pay:'kaspi',card:'',post:{},taxi:{}},LS.get('ck',{}))};
S.ck.post=S.ck.post||{};S.ck.taxi=S.ck.taxi||{};S.ck.cardDraft=null;
const save=()=>{LS.set('cart',S.cart);LS.set('fav',S.fav);LS.set('orders',S.orders);LS.set('seen',S.seen)};
const cartCount=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);

/* router */
const routes={};
function go(h){location.hash=h}
function back(){history.length>1?history.back():go('#/home')}
window.addEventListener('hashchange',render);
function nav(active){
  const it=[['home','Басты',I.home],['orders','Тапсырыстар',I.orders],['cart','Себет',I.cart],['fav','Таңдаулы',I.heart],['profile','Профиль',I.user]];
  const c=cartCount();
  return `<nav class="nav">${it.map(([k,l,ic])=>`<button class="${k===active?'on':''}" onclick="go('#/${k}')">${ic}${k==='cart'&&c?`<span class="badge">${c}</span>`:''}${l}</button>`).join('')}</nav>`;
}
function topbar(title,right=''){return `<div class="top"><button class="ib" onclick="back()" aria-label="Артқа">${I.back}</button><h1>${title}</h1>${right||'<span style="width:40px"></span>'}</div>`}
function pcard(p){
  const f=S.fav.includes(p.id);
  return `<div class="pc"><button style="display:block;width:100%;text-align:left" onclick="go('#/p/${p.id}')"><img src="${img(p)}" alt="${esc(p.n)}" loading="lazy"><div class="b"><div class="n">${esc(p.n)}</div><div class="s">${esc(p.s)}</div><div class="row"><span class="p">${fmt(p.p)}</span><span></span></div>${p.off?'<div class="offl">Қолжетімсіз</div>':''}</div></button>
  <button class="fav ${f?'on':''}" onclick="togFav('${p.id}',this)" aria-label="Таңдаулы">${f?I.heartF:I.heart}</button>
  ${p.off?'':`<button class="add" style="position:absolute;right:10px;bottom:10px" onclick="addCart('${p.id}',1)" aria-label="Себетке қосу">${I.plus}</button>`}</div>`;
}
function li(p){return `<button class="li" onclick="go('#/p/${p.id}')"><img src="${img(p)}" alt="" loading="lazy"><div class="t"><b>${esc(p.n)}</b><small>${esc(p.s)}</small></div><span class="pr">${fmt(p.p)}</span><span class="chev">${I.chev}</span></button>`}

/* actions */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2000)}
function addCart(id,q,toCart){if(P[id]&&P[id].off){toast('Бұл тауар қазір қолжетімсіз');return}S.cart[id]=(S.cart[id]||0)+q;save();toast(`${P[id].n} себетке қосылды`);if(toCart){go('#/cart');return}const b=document.querySelector('.nav .badge');if(b)b.textContent=cartCount();else render(true)}
function setQty(id,q){if(q<=0)delete S.cart[id];else S.cart[id]=q;save();render(true)}
function togFav(id,el){const i=S.fav.indexOf(id);i<0?S.fav.push(id):S.fav.splice(i,1);save();
  if(el){const on=S.fav.includes(id);el.classList.toggle('on',on);el.innerHTML=on?I.heartF:I.heart}
  toast(S.fav.includes(id)?'Таңдаулыларға қосылды':'Таңдаулылардан алынды');if(location.hash==='#/fav')render(true)}
function share(id){const u=location.origin+location.pathname+'#/p/'+id;if(navigator.share){navigator.share({title:P[id].n,text:'EREKE M&D — '+P[id].n,url:u}).catch(()=>{})}else{try{navigator.clipboard.writeText(u);toast('Сілтеме көшірілді')}catch(e){toast(u)}}}

const OBL=[['Абай облысы','Семей'],['Ақмола облысы','Көкшетау'],['Ақтөбе облысы','Ақтөбе'],['Алматы облысы','Қонаев'],['Атырау облысы','Атырау'],['Батыс Қазақстан облысы','Орал'],['Жамбыл облысы','Тараз'],['Жетісу облысы','Талдықорған'],['Қарағанды облысы','Қарағанды'],['Қостанай облысы','Қостанай'],['Қызылорда облысы','Қызылорда'],['Маңғыстау облысы','Ақтау'],['Павлодар облысы','Павлодар'],['Солтүстік Қазақстан облысы','Петропавл'],['Түркістан облысы','Түркістан'],['Ұлытау облысы','Жезқазған'],['Шығыс Қазақстан облысы','Өскемен']];
const AUD={'Алматы облысы':[['Қонаев','Облыс орталығы (қала)'],['Алатау','Қала'],['Балқаш ауданы',''],['Еңбекшіқазақ ауданы',''],['Жамбыл ауданы','Ауылдары бар'],['Іле ауданы',''],['Кеген ауданы',''],['Қарасай ауданы',''],['Райымбек ауданы',''],['Талғар ауданы',''],['Ұйғыр ауданы','']]};
const LOC={'Жамбыл ауданы':[['Ұзынағаш','Аудан орталығы · 040600'],...['Ақсеңгір','Ақтерек','Аққайнар','Бериктас','Бозой','Жамбыл','Қарақастек','Мыңбаев','Самсы','Сарытауқұм','Талап','Темиржол','Шиен'].map(n=>[n,'Ауылдық округ'])]};
const IDX={'Ұзынағаш':'040600'};
const PK=()=>S.ck.post, TX=()=>S.ck.taxi;
function phoneFmt(v){let d=v.replace(/\D/g,'');if(v.trim().startsWith('+7'))d=d.slice(1);else if(d[0]==='8'||(d.length>=11&&d[0]==='7'))d=d.slice(1);const p=d.slice(0,10);if(!p)return v.trim()?'+7':'';let s='+7 ('+p.slice(0,3);if(p.length>=3)s+=')';if(p.length>3)s+=' '+p.slice(3,6);if(p.length>6)s+='-'+p.slice(6,8);if(p.length>8)s+='-'+p.slice(8,10);return s}
function phoneOk(v){return v.replace(/\D/g,'').length===11}
function fld(label,id,val,ph,extra=''){return `<div class="fl"><label for="${id}">${label}</label><div class="inp"><input id="${id}" value="${esc(val||'')}" placeholder="${ph}" ${extra}></div></div>`}
function sel(label,val,ph,onclick,dis){return `<div class="fl"><label>${label}</label><button class="inp selb ${dis?'dis':''}" onclick="${dis?`toast('Алдымен жоғарыдағы жолды толтырыңыз')`:onclick}"><span class="${val?'':'ph'}">${esc(val||ph)}</span>${I.chev}</button></div>`}
function postAddr(p){return [p.loc,p.street,p.house].filter(Boolean).join(', ')+(p.idx?' · '+p.idx:'')}

routes.post=()=>{const p=PK();
  return `<section class="view">${topbar('Қазпошта арқылы жеткізу')}<div class="scroll"><div class="sec" style="padding-top:0">
  <div class="lbl">МЕКЕНЖАЙ</div><div class="card blk" style="margin-top:0">
  ${sel('Облыс',p.obl,'Облысты таңдаңыз',`go('#/pick/obl')`)}
  ${sel('Аудан',p.aud,'Ауданды таңдаңыз',`go('#/pick/aud')`,!p.obl)}
  ${sel('Қала / ауыл',p.loc,'Мысалы: Ұзынағаш',`go('#/pick/loc')`,!p.obl)}
  ${fld('Көше','pstreet',p.street,'Мысалы: Абай көшесі',`oninput="PK().street=this.value"`)}
  ${fld('Үй / пәтер','phouse',p.house,'Мысалы: 12, 5-пәтер',`oninput="PK().house=this.value"`)}
  ${fld('Пошта индексі','pidx',p.idx,'Мысалы: 040600',`inputmode="numeric" maxlength="6" oninput="this.value=this.value.replace(/\\D/g,'');PK().idx=this.value"`)}
  <p class="hint">Индексті білмесеңіз, оны <a href="https://post.kz" target="_blank" rel="noopener">Қазпоштаның сайтынан</a> мекенжай бойынша табуға болады.</p></div>
  <div class="lbl">АЛУШЫ</div><div class="card blk" style="margin-top:0">
  ${fld('Байланыс нөмірі','pphone',p.phone,'+7 (7__) ___-__-__',`type="tel" inputmode="tel" oninput="this.value=phoneFmt(this.value);PK().phone=this.value"`)}
  ${fld('Аты-жөні','pname',p.name,'Аты-жөніңізді жазыңыз',`autocomplete="name" oninput="PK().name=this.value"`)}
  </div></div></div><div class="buybar"><button class="btn btn-g" onclick="savePost()">Мекенжайды сақтау</button></div></section>`};
function savePost(){const p=PK();const miss=[['obl','Облысты'],['loc','Қала / ауылды'],['street','Көшені'],['house','Үй нөмірін']].find(([k])=>!(p[k]||'').trim());
  if(miss){toast(miss[1]+' толтырыңыз');return}
  if(p.idx&&p.idx.length!==6){toast('Пошта индексі 6 саннан тұрады');return}
  if(!phoneOk(p.phone||'')){toast('Байланыс нөмірін толық жазыңыз');return}
  if(!(p.name||'').trim()){toast('Аты-жөніңізді жазыңыз');return}
  p.ok=true;S.ck.del='post';LS.set('ck',S.ck);toast('Мекенжай сақталды');back()}

let pq2='';
routes.pick=(kind)=>{const p=PK();let title,groups;
  if(kind==='obl'){title='Облысты таңдаңыз';groups=[['Республикалық маңызы бар қалалар',OBL_CITY],['Облыстар',OBL.map(([n,c])=>[n,'Орталығы: '+c])]]}
  else if(kind==='aud'){title=p.obl||'Аудан';const a=AUD[p.obl];groups=a?[['Қалалар мен аудандар',a]]:[]}
  else{title=p.aud||p.obl||'Елді мекен';const l=LOC[p.aud];groups=l?[['Елді мекендер',l]]:[]}
  return `<section class="view">${topbar(esc(title))}<label class="search">${I.search}<input id="pq" placeholder="Атауын жазып іздеңіз" value="${esc(pq2)}" oninput="pq2=this.value;pickFilter('${kind}')" autofocus></label><div class="scroll"><div class="sec" id="plist">${pickList(kind,groups)}</div></div></section>`};
function pickGroups(kind){const p=PK();if(kind==='obl')return [['Республикалық маңызы бар қалалар',OBL_CITY],['Облыстар',OBL.map(([n,c])=>[n,'Орталығы: '+c])]];if(kind==='aud'){const a=AUD[p.obl];return a?[['Қалалар мен аудандар',a]]:[]}const l=LOC[p.aud];return l?[['Елді мекендер',l]]:[]}
function pickList(kind,groups){const q=pq2.trim().toLowerCase();let html='';
  if(kind==='obl'&&!q)html+=`<p class="hint" style="margin:0 0 12px">Қазақстанда 17 облыс, 3 республикалық маңызы бар қала бар. Демода аудандар Алматы облысы, ауылдар Жамбыл ауданы бойынша берілген, басқасын өзіңіз жаза аласыз.</p>`;
  for(const [g,items] of groups){const f=items.filter(([n])=>n.toLowerCase().includes(q));if(!f.length)continue;
    html+=`<div class="lbl">${esc(g)}</div><div class="list">${f.map(([n,s])=>`<button class="li" onclick="pickSet('${kind}',this.dataset.v)" data-v="${esc(n)}"><span class="t"><b>${esc(n)}</b>${s?`<small>${esc(s)}</small>`:''}</span>${I.chev}</button>`).join('')}</div>`}
  if(q&&kind!=='obl')html+=`<button class="btn btn-l" style="margin-top:12px" onclick="pickSet('${kind}',pq2.trim())">«${esc(pq2.trim())}» деп жазу</button>`;
  if(!q&&kind!=='obl'&&!groups.length)html+=`<div class="empty" style="padding:30px 10px"><b>Атауын жазыңыз</b>Демода бұл өңірдің тізімі жоқ. Жоғарыға атауын жазып, «деп жазу» батырмасын басыңыз.</div>`;
  if(q&&kind==='obl'&&!html)html=`<div class="empty"><b>Табылмады</b>Басқаша жазып көріңіз</div>`;
  return html}
function pickFilter(kind){const el=$('#plist');if(el)el.innerHTML=pickList(kind,pickGroups(kind))}
function pickSet(kind,v){if(!v)return;const p=PK();pq2='';
  if(kind==='obl'){if(p.obl!==v){p.aud='';p.loc=''}p.obl=v;if(/қаласы$/.test(v)){p.aud='—';p.loc=v.replace(' қаласы','');history.back();return}location.replace('#/pick/aud');return}
  if(kind==='aud'){if(p.aud!==v)p.loc='';p.aud=v;if(!/ауданы$/.test(v)){p.loc=v;history.back();return}location.replace('#/pick/loc');return}
  p.loc=v;if(IDX[v]&&!p.idx)p.idx=IDX[v];history.back()}

function drvBtnsHtml(){const t=TX();const d=(t.dphone||'').replace(/\D/g,'');if(d.length!==11)return `<p class="hint">Нөмір толық жазылса, жүргізушіге бірден WhatsApp арқылы жазуға немесе қоңырау шалуға болады.</p>`;
 const msg=encodeURIComponent(`Сәлеметсіз бе${t.dname?', '+t.dname:''}! EREKE M&D дүкенінен тапсырысты жеткізіп бере аласыз ба? Мекенжай: ${S.ck.addr||'—'}`);
 return `<div style="display:flex;gap:8px;margin-top:12px"><a class="btn" style="background:#25D366;color:#fff;height:44px;font-size:14px" href="https://wa.me/${d}?text=${msg}" target="_blank" rel="noopener">WhatsApp-қа жазу</a><a class="btn btn-l" style="height:44px;font-size:14px" href="tel:+${d}">Қоңырау шалу</a></div>`}
function drvBtns(){const el=$('#drvb');if(el)el.innerHTML=drvBtnsHtml()}
routes.taxi=()=>{const t=TX();
  return `<section class="view">${topbar('Такси арқылы жеткізу')}<div class="scroll"><div class="sec" style="padding-top:0">
  <div class="note">🚕 Ұзынағаш ішінде – <b>500 ₸</b>. Басқа аймаққа бағасы келісім бойынша бөлек төленеді.</div>
  <div class="lbl">ТАКСИ ҚОСЫМШАСЫН ТАҢДАҢЫЗ</div>
  ${TAXI.map(([k,n,s,c,l,url,kz])=>`<div class="opt tx ${t.app===k?'on':''}" onclick="TX().app='${k}';render(true)"><span class="badge" style="background:${c}">${l}</span><span class="t"><b>${n}${kz?' <i class="kz">KZ</i>':''}</b><small>${s}</small></span>${(k==='own'||k==='local')?'<span class="radio"></span>':`<button class="open" onclick="event.stopPropagation();TX().app='${k}';${url?`window.open('${url}','_blank','noopener')`:`toast('Қосымшаны телефоныңыздан ашыңыз')`};render(true)">Ашу</button>`}</div>`).join('')}
  ${(t.app==='own'||t.app==='local')?`<div class="lbl">${t.app==='local'?'ЖЕРГІЛІКТІ ТАКСИ ЖҮРГІЗУШІСІ':'ЖЕКЕ ТАКСИ'}</div><div class="card blk" style="margin-top:0">${fld('Жүргізушінің аты-жөні','dname',t.dname,'Мысалы: Ерлан Сапаров',`autocomplete="off" oninput="TX().dname=this.value"`)}${fld('WhatsApp немесе телефон нөмірі','dphone',t.dphone,'+7 (7__) ___-__-__',`type="tel" inputmode="tel" oninput="this.value=phoneFmt(this.value);TX().dphone=this.value;drvBtns()"`)}<div id="drvb">${drvBtnsHtml()}</div></div>`:''}
  <div class="lbl">ЖЕТКІЗУ МЕКЕНЖАЙЫ</div><div class="card blk" style="margin-top:0">${fld('Мекенжай','taddr',S.ck.addr,'Мысалы: Ұзынағаш, Абай к-сі, 12',`oninput="S.ck.addr=this.value;drvBtns()"`)}</div>
  </div></div><div class="buybar"><button class="btn btn-g" onclick="saveTaxi()">Таңдауды сақтау</button></div></section>`};
function saveTaxi(){const t=TX();if(!t.app){toast('Такси қосымшасын таңдаңыз');return}
  if((t.app==='own'||t.app==='local')&&!(t.dname||'').trim()){toast('Жүргізушінің аты-жөнін жазыңыз');$('#dname').focus();return}
  if((t.app==='own'||t.app==='local')&&!phoneOk(t.dphone||'')){toast('WhatsApp немесе телефон нөмірін толық жазыңыз');$('#dphone').focus();return}
  if(!S.ck.addr.trim()){toast('Жеткізу мекенжайын жазыңыз');$('#taddr').focus();return}
  if(!/^taxi/.test(S.ck.del))S.ck.del='taxi';LS.set('ck',S.ck);toast('Такси таңдалды');back()}

routes.card=()=>{const c=S.ck.cardDraft||(S.ck.cardDraft={no:'',exp:'',cvv:'',holder:''});
  return `<section class="view">${topbar('Карта тіркеу')}<div class="scroll"><div class="sec" style="padding-top:0">
  <div class="bank"><div class="chip-c"></div><div class="no" id="cno">${esc(c.no||'••••  ••••  ••••  ••••')}</div><div class="bf"><span id="cho">${esc(c.holder||'КАРТА ИЕСІ')}</span><span id="cex">${esc(c.exp||'••/••')}</span></div><b class="vm">Visa / Mastercard</b></div>
  <div class="card blk">
  ${fld('Карта нөмірі','cnum',c.no,'0000 0000 0000 0000',`inputmode="numeric" autocomplete="cc-number" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,16).replace(/(\\d{4})(?=\\d)/g,'$1 ');S.ck.cardDraft.no=this.value;$('#cno').textContent=this.value||'••••  ••••  ••••  ••••'"`)}
  <div style="display:flex;gap:10px"><div style="flex:1">${fld('Мерзімі','cexp',c.exp,'АА / ЖЖ',`inputmode="numeric" autocomplete="cc-exp" oninput="let d=this.value.replace(/\\D/g,'').slice(0,4);this.value=d.length>2?d.slice(0,2)+'/'+d.slice(2):d;S.ck.cardDraft.exp=this.value;$('#cex').textContent=this.value||'••/••'"`)}</div>

  ${fld('Карта иесі','chold',c.holder,'IVAN IVANOV',`autocomplete="cc-name" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z ]/g,'');S.ck.cardDraft.holder=this.value;$('#cho').textContent=this.value||'КАРТА ИЕСІ'"`)}
  <p class="hint">🔒 Карта деректері қорғалған байланыс арқылы банкке жіберіледі. EREKE M&D карта нөмірін сақтамайды. Бұл демо нұсқа – нақты төлем жүрмейді.</p></div>
  </div></div><div class="buybar"><button class="btn btn-g" onclick="saveCard()">Картаны тіркеу</button></div></section>`};
function saveCard(){const c=S.ck.cardDraft;const d=c.no.replace(/\D/g,'');
  if(d.length!==16){toast('Карта нөмірі 16 саннан тұрады');return}
  const [m,y]=(c.exp||'').split('/');if(!(m>=1&&m<=12&&y&&y.length===2)){toast('Мерзімін АА/ЖЖ түрінде жазыңыз');return}
  if((c.cvv||'').length!==3){toast('CVV 3 саннан тұрады');return}
  if(!c.holder.trim()){toast('Карта иесін латынша жазыңыз');return}
  S.ck.card='•••• '+d.slice(-4);S.ck.cardDraft=null;S.ck.pay='visa';LS.set('ck',S.ck);toast('Карта тіркелді');back()}

routes.remote=()=>{const code=S.ck.rcode||(S.ck.rcode=Math.random().toString(36).slice(2,8).toUpperCase());const link=location.origin+'/?pay='+code;const msg=`EREKE M&D: тапсырысымды төлеп жібере аласың ба? Сомасы ${fmt(cartSum()+(DEL[S.ck.del]||DEL.post).p)}. Төлем сілтемесі: ${link}`;

  <a class="btn" style="background:#229ED9;color:#fff;margin-top:10px" href="https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Telegram арқылы жіберу</a>
  <button class="btn btn-l" style="margin-top:10px" onclick="navigator.clipboard&&navigator.clipboard.writeText($('#rlink').value).then(()=>toast('Сілтеме көшірілді'),()=>toast('Көшіру мүмкін болмады'))">Сілтемені көшіру</button>
  </div></div><div class="buybar"><button class="btn btn-g" onclick="S.ck.pay='remote';LS.set('ck',S.ck);back()">Дайын</button></div></section>`};

  const k=S.ck;const d=DEL[k.del]||DEL.post;const p=k.post,t=k.taxi;const tn=t.app&&TAXI.find(x=>x[0]===t.app);
  const addrBlock=k.del==='post'
    ?`<button class="addr" onclick="go('#/post')"><span class="oi">${I.pin}</span><span class="t">${p.ok?`<b>${esc(postAddr(p))}</b><small>${esc([p.obl,p.aud!=='—'?p.aud:''].filter(Boolean).join(', '))} · ${esc(p.name)} · ${esc(p.phone)}</small>`:`<b>Қазпошта мекенжайын толтырыңыз</b><small>Облыс, аудан, ауыл, көше, индекс, алушы</small>`}</span>${I.chev}</button>`
    :`<button class="addr" onclick="go('#/taxi')"><span class="oi">${I.pin}</span><span class="t">${k.addr&&tn?`<b>${esc(k.addr)}</b><small>${esc(tn[1])}${(t.app==='own'||t.app==='local')&&t.dphone?' · '+esc(t.dname||'')+' '+esc(t.dphone):''}</small>`:`<b>Такси мен мекенжайды таңдаңыз</b><small>Qajet Taxi, Yandex Go, inDrive және т.б.</small>`}</span>${I.chev}</button>`;
  return `<section class="view">${topbar('Тапсырыс беру')}<div class="scroll"><div class="sec" style="padding-top:0">
  <div class="card blk"><h3>Байланыс</h3>${fld('Аты-жөніңіз','cname',k.cname??(p.name||''),'Мысалы: Айгүл',`autocomplete="name" oninput="S.ck.cname=this.value;LS.set('ck',S.ck)"`)}${fld('Телефон нөміріңіз','cphone',k.cphone??(p.phone||''),'+7 (7__) ___-__-__',`type="tel" inputmode="tel" oninput="this.value=phoneFmt(this.value);S.ck.cphone=this.value;LS.set('ck',S.ck)"`)}</div>
  <div class="card blk"><h3>Жеткізу мекенжайы</h3>${addrBlock}</div>
  <div class="card blk"><h3>Жеткізу тәсілі</h3>${Object.entries(DEL).map(([key,o])=>`<button class="opt ${k.del===key?'on':''}" onclick="S.ck.del='${key}';LS.set('ck',S.ck);go('${key==='post'?'#/post':'#/taxi'}')"><span class="oi">${o.i}</span><span class="t"><b>${o.n}</b><small>${o.s}</small><em>${o.pt}</em></span><span class="radio"></span></button>`).join('')}</div>
  <div class="card blk"><h3>Жеткізу уақыты</h3>${[['today','Бүгін, 18:00–21:00'],['tomorrow','Ертең, 10:00–14:00']].map(([key,l])=>`<button class="tline ${k.time===key?'on':''}" onclick="S.ck.time='${key}';render(true)"><span class="radio"></span>${l}</button>`).join('')}</div>
  <div class="card blk"><h3>Төлем әдісі</h3>${PAY.map(([key,n,s,i])=>{const sub=key==='visa'&&k.card?'Тіркелген карта: '+k.card:s;const nav=key==='visa'?(k.card?'':`go('#/card')`):key==='remote'?`go('#/remote')`:'';return `<button class="opt ${k.pay===key?'on':''}" onclick="S.ck.pay='${key}';LS.set('ck',S.ck);${nav||'render(true)'}"><span class="oi">${i}</span><span class="t"><b>${n}</b><small>${esc(sub)}</small>${key==='visa'&&k.card?`<em onclick="event.stopPropagation();go('#/card')">Басқа карта тіркеу</em>`:''}</span><span class="radio"></span></button>`}).join('')}</div>
  <div class="card sum" style="margin-top:12px"><div class="row"><span>Тауарлар</span><span>${fmt(cartSum())}</span></div><div class="row"><span>Жеткізу (${d.n})</span><span>${d.p?fmt(d.p):d.pt}</span></div><div class="row tot"><span>Барлығы</span><span>${fmt(cartSum()+d.p)}</span></div></div>
  </div></div><div class="buybar"><button class="btn btn-g" onclick="placeOrder()">Тапсырысты растау</button></div></section>`;
};
async function placeOrder(){
  const k=S.ck;const d=DEL[k.del]||DEL.post;
  if(k.del==='post'&&!k.post.ok){toast('Қазпошта мекенжайын толтырыңыз');go('#/post');return}
  if(k.del!=='post'&&(!k.taxi.app||!k.addr.trim())){toast('Такси мен мекенжайды таңдаңыз');go('#/taxi');return}
  if(k.pay==='visa'&&!k.card){go('#/card');return}
  const cname=(k.cname??k.post.name??'').trim(),cphone=(k.cphone??k.post.phone??'');
  if(!cname){toast('Аты-жөніңізді жазыңыз');$('#cname')&&$('#cname').focus();return}
  if(!phoneOk(cphone)){toast('Телефон нөміріңізді толық жазыңыз');$('#cphone')&&$('#cphone').focus();return}
  const items=Object.entries(S.cart).filter(([id])=>P[id]).map(([slug,qty])=>({slug,qty}));
  const off=items.find(i=>P[i.slug].off);if(off){toast(P[off.slug].n+' қазір қолжетімсіз, себеттен алып тастаңыз');return}
  if(!SB){toast('Серверге қосылу мүмкін болмады');return}
  const addr=k.del==='post'?postAddr(k.post):k.addr;
  const tx=k.taxi.app&&TAXI.find(x=>x[0]===k.taxi.app);
  const details=k.del==='post'?{type:'kazpost',obl:k.post.obl,aud:k.post.aud,loc:k.post.loc,street:k.post.street,house:k.post.house,idx:k.post.idx,recipient:k.post.name,recipient_phone:k.post.phone}:{type:'taxi',app:tx?tx[1]:'',driver_name:k.taxi.dname||'',driver_phone:k.taxi.dphone||''};
  const btn=document.querySelector('.buybar .btn');if(btn){btn.disabled=true;btn.textContent='Жіберілуде...'}
  const {data,error}=await SB.rpc('place_order',{p_customer_key:CKEY,p_store_slug:CFG.store,p_items:items,p_customer_name:cname,p_customer_phone:cphone,p_delivery_method:k.del,p_delivery_address:addr,p_delivery_details:details,p_delivery_time:k.time==='today'?'Бүгін, 18:00–21:00':'Ертең, 10:00–14:00',p_payment_method:PAY.find(x=>x[0]===k.pay)[1]});
  if(error){if(btn){btn.disabled=false;btn.textContent='Тапсырысты растау'}toast('Қате: '+(error.message||'жіберілмеді'));return}
  S.lastNo=data.order_number;LS.set('lastNo',S.lastNo);S.cart={};k.rcode=null;save();LS.set('ck',k);CLOUD.orders=null;fetchOrders();go('#/done');
}

routes.done=()=>`<section class="view"><div class="done"><div class="ok">${I.check}</div><h2>Тапсырыс жіберілді!</h2><p>${S.lastNo?`<b style="color:var(--ink)">№${esc(S.lastNo)}</b><br>`:''}Сатушы тапсырысыңызды қазір көреді.<br>Статусы «Тапсырыстарым» бетінде жаңарып отырады.</p><div class="btns"><button class="btn btn-l" onclick="go('#/orders')">Тапсырысты бақылау</button><button class="btn btn-g" onclick="go('#/home')">Басты бетке қайту</button></div></div></section>`;

const OST={NEW:['Жаңа · сатушы қарап жатыр','#2563EB','#E8F0FE',0],ACCEPTED:['🟡 Қабылданды','#B7791F','#FEF6E0',1],PREPARING:['🟠 Дайындалуда','#EA580C','#FFEDE2',2],READY:['🟢 Дайын','#16A34A','#E3F7EA',3],COMPLETED:['✓ Аяқталды','#475569','#EEF1F4',4],CANCELLED:['✕ Бас тартылды','#DC2626','#FDE8E8',-1]};
routes.orders=()=>{
  if(CLOUD.orders===null){fetchOrders();return `<section class="view">${topbar('Тапсырыстарым')}<div class="scroll"><div class="empty"><b>Жүктелуде...</b></div></div>${nav('orders')}</section>`}
  const list=CLOUD.orders;
  if(!list.length)return `<section class="view">${topbar('Тапсырыстарым')}<div class="scroll"><div class="empty"><div class="ei">${I.orders}</div><b>Тапсырыс әлі жоқ</b>Алғашқы тапсырысыңызды беріңіз</div></div>${nav('orders')}</section>`;
  return `<section class="view">${topbar('Тапсырыстарым')}<div class="scroll"><div class="sec" style="padding-top:0"><p class="hint" style="margin:4px 4px 0">Статус сатушы өзгерткен сәтте осында өзі жаңарады.</p>${list.map(o=>{const st=OST[o.status]||OST.NEW;const step=st[3];
  return `<div class="card ord"><div class="h"><b>№${esc(o.order_number)}</b><span class="st" style="color:${st[1]};background:${st[2]}">${st[0]}</span></div><div style="font-size:12.5px;color:var(--mut);margin-top:4px">${new Date(o.created_at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} · ${esc(o.payment_method||'')}</div>
  <div class="th">${o.items.slice(0,6).map(i=>P[i.slug]?`<img src="${img(P[i.slug])}" alt="" title="${esc(i.name)} × ${i.qty}">`:'').join('')}</div>
  <div style="font-size:13px;margin-top:8px">${o.items.map(i=>esc(i.name)+' × '+i.qty).join(', ')}</div>
  ${step>=0?`<div class="steps">${[0,1,2,3,4].map(i=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div><div class="stl">${['Жаңа','Қабылданды','Дайындалуда','Дайын','Аяқталды'].map((l,i)=>`<span class="${i<=step?'on':''}">${l}</span>`).join('')}</div>`:`<div class="hint" style="color:#DC2626">Тапсырыстан бас тартылды${o.cancel_reason?': '+esc(o.cancel_reason):''}</div>`}
  <div class="f"><span style="color:var(--mut)">${esc(o.delivery_address||'')}</span><b style="color:var(--g)">${fmt(o.total)}</b></div></div>`}).join('')}</div></div>${nav('orders')}</section>`;
};

routes.fav=()=>{
  const items=S.fav.map(id=>P[id]).filter(Boolean);
  return `<section class="view">${topbar('Таңдаулылар')}<div class="scroll">${items.length?`<div class="sec" style="padding-top:6px"><div class="grid">${items.map(pcard).join('')}</div></div>`:`<div class="empty"><div class="ei">${I.heart}</div><b>Таңдаулылар бос</b>Ұнаған өнімнің ♡ белгісін басыңыз</div>`}</div>${nav('fav')}</section>`;
};

let sq='';
routes.search=()=>`<section class="view">${topbar('Іздеу')}<label class="search">${I.search}<input id="sq" placeholder="Мысалы: құрт, бал, шай" value="${esc(sq)}" oninput="sq=this.value;doSearch()" autofocus></label><div class="scroll"><div class="sec" id="sres"></div></div>${nav('home')}</section>`;
function doSearch(){
  const q=sq.trim().toLowerCase();const el=$('#sres');if(!el)return;
  if(!q){el.innerHTML=`<div class="sec-h"><h2>Санаттар</h2></div><div class="chips" style="padding:0;flex-wrap:wrap">${CATS.map(c=>`<button class="chip" onclick="go('#/c/${c.id}')">${esc(c.n)}</button>`).join('')}</div>`;return}
  const r=PRODUCTS.filter(p=>(p.n+' '+p.c+' '+p.s).toLowerCase().includes(q));
  el.innerHTML=r.length?`<div class="sec-h"><h2>Нәтижелер</h2><span>${r.length} тауар</span></div><div class="list">${r.map(li).join('')}</div>`:`<div class="empty"><b>Ештеңе табылмады</b>Басқа сөзбен іздеп көріңіз</div>`;
}

routes.profile=()=>`<section class="view">${topbar('Профиль')}<div class="scroll"><div class="sec" style="padding-top:0">
<div class="card pf"><div class="av">Т</div><div><b style="font-size:17px">Тұтынушы</b><div style="color:var(--mut);font-size:13px;margin-top:2px">Кіру демо нұсқада қосылмаған</div></div></div>
<div class="card" style="margin-top:12px">
<button class="pr-row" onclick="go('#/orders')"><span class="ic">${I.orders}</span><span>Тапсырыстарым</span><small>${CLOUD.orders?CLOUD.orders.length:''}</small></button>
<button class="pr-row" onclick="go('#/fav')"><span class="ic">${I.heart}</span><span>Таңдаулылар</span><small>${S.fav.length}</small></button>
<button class="pr-row" onclick="toast('Мекенжайлар жақында қосылады')"><span class="ic">${I.pin}</span><span>Мекенжайларым</span>${I.chev}</button>
<button class="pr-row" onclick="toast('Карта тіркеу жақында қосылады')"><span class="ic">${I.card}</span><span>Төлем карталары</span>${I.chev}</button>
<button class="pr-row" onclick="toast('Қазақша · Русский — жақында')"><span class="ic">🌐</span><span>Тіл</span><small>Қазақша</small></button>
<button class="pr-row" onclick="toast('Әр тапсырысқа шағын сыйлық беріледі')"><span class="ic">${I.gift}</span><span>Сыйлықтар</span>${I.chev}</button>
</div>
<div class="card" style="margin-top:12px;padding:14px;font-size:13.5px;color:var(--mut);line-height:1.5"><b style="color:var(--ink)">EREKE M&D</b> — табиғи сүт өнімдері мен қазақы тағамдардың онлайн дүкені. Ұзынағаш бойынша үйге дейін жеткіземіз.</div>
<button class="btn btn-l" style="margin-top:12px" onclick="if(confirm('Себет, таңдаулылар мен тапсырыстар тазартылсын ба?')){S.cart={};S.fav=[];S.orders=[];S.seen=[];save();render()}">Демо деректерін тазарту</button>
</div></div>${nav('profile')}</section>`;

/* ERKE cloud — Supabase (ERKE PAY-мен ортақ) */
const CFG=window.ERKE_CFG||{};
const SB=(window.supabase&&CFG.url)?window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:false,autoRefreshToken:false}}):null;
const CKEY=(()=>{let k=LS.get('ckey',null);if(!k){k=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)});LS.set('ckey',k)}return k})();
const CLOUD={orders:null,sig:''};S.lastNo=LS.get('lastNo','');
function applyProducts(rows){rows.forEach(r=>{if(!r||!r.slug)return;let p=P[r.slug];if(!p){if(!CATS.find(c=>c.n===r.category))return;p={id:r.slug,n:r.name,c:r.category,s:r.size||'',p:r.price,d:r.description||'',img:r.image_url||''};PRODUCTS.push(p);P[r.slug]=p}p.p=r.price;p.n=r.name;if(r.size)p.s=r.size;p.off=!r.is_available;if(r.description)p.d=r.description;if(r.image_url&&!/ereke\.vercel\.app\/img\/p\//.test(r.image_url))p.img=r.image_url})}
const busy=()=>{const a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')};
async function syncProducts(){if(!SB)return;const {data,error}=await SB.from('products').select('slug,name,category,size,price,description,image_url,is_available');if(error||!data)return;applyProducts(data);if(!busy())render(true)}
let fetching=false;
async function fetchOrders(){if(!SB||fetching)return;fetching=true;try{const {data,error}=await SB.rpc('get_customer_orders',{p_customer_key:CKEY});if(error)return;const list=data||[];
  const sig=JSON.stringify(list.map(o=>[o.id,o.status]));
  if(CLOUD.orders&&sig!==CLOUD.sig){list.forEach(o=>{const old=CLOUD.orders.find(x=>x.id===o.id);if(old&&old.status!==o.status)toast('№'+o.order_number+': '+(OST[o.status]||OST.NEW)[0])})}
  const changed=sig!==CLOUD.sig||CLOUD.orders===null;CLOUD.orders=list;CLOUD.sig=sig;
  if(changed&&/^#\/(orders|profile)/.test(location.hash)&&!busy())render(true)}finally{fetching=false}}
if(SB){syncProducts();fetchOrders();
  try{SB.channel('erke-products').on('postgres_changes',{event:'*',schema:'public',table:'products'},pl=>{applyProducts([pl.new]);if(!busy())render(true)}).subscribe()}catch(e){}
  setInterval(()=>{if(/^#\/(orders|done|profile)/.test(location.hash)||document.visibilityState==='visible')fetchOrders()},4000)}

function render(keepScroll){
  const sc=document.querySelector('.scroll');const y=keepScroll&&sc?sc.scrollTop:0;
  const h=location.hash.replace(/^#\/?/,'')||'welcome';const [r,arg]=h.split('/');
  const fn=routes[r]||routes.welcome;
  if(!keepScroll&&r==='c')catFilter='';
  if(!keepScroll&&r==='p')pq=1;
  $('#root').innerHTML=fn(arg?decodeURIComponent(arg):undefined);
  const sc2=document.querySelector('.scroll');if(sc2)sc2.scrollTop=y;
  if(r==='search')doSearch();
  document.querySelector('meta[name=theme-color]').content=r==='welcome'?'#cfe3f2':'#F3F5F2';
}
render();
</script>
</body>
</html>
